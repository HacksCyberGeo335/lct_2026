x-worker: &worker
  build:
    context: ./prom_app/services/media_worker
  image: ${MEDIA_WORKER_IMAGE:-prom_app_media_worker:local}
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    postgres:
      condition: service_healthy
    s3_init:
      condition: service_completed_successfully
    upload_service:
      condition: service_started
  extra_hosts:
    - "host.docker.internal:host-gateway"
x-worker-env: &worker-env
  DATABASE_URL: ${DATABASE_URL:-postgres://prom_app:prom_app_password@postgres:5432/prom_app?sslmode=disable}
  MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://s3-storage:9000}
  S3_ACCESS_KEY: ${WORKER_S3_ACCESS_KEY:-${MINIO_ROOT_USER:-prom_app}}
  S3_SECRET_KEY: ${WORKER_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-prom_app_password}}
  MINIO_DETECTIONS_BUCKET: ${MINIO_DETECTIONS_BUCKET:-video-detections-prod}
  FRAME_INTERVAL_SECONDS: ${FRAME_INTERVAL_SECONDS:-1}
  MAX_FRAMES: ${MAX_FRAMES:-300}
  MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-2147483648}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-180}
  POLL_SECONDS: ${POLL_SECONDS:-2}
  INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-120}
services:
  yolo_worker:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_KIND: yolo
      TRITON_HTTP_URL: ${TRITON_HTTP_URL:-http://host.docker.internal:8000}
      TRITON_MODEL_NAME: ${TRITON_MODEL_NAME:-detector}
      TRITON_MODEL_VERSION: ${TRITON_MODEL_VERSION:-1}
      TRITON_INPUT_NAME: ${TRITON_INPUT_NAME:-images}
      TRITON_OUTPUT_NAME: ${TRITON_OUTPUT_NAME:-output0}
      YOLO_IMAGE_SIZE: ${YOLO_IMAGE_SIZE:-768}
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.25}
      INFERENCE_API_KEY: ${TRITON_API_KEY:-}
  vlm_worker:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_KIND: vlm
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8001/v1}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-VL-2B-Instruct}
      VLM_MAX_EDGE: ${VLM_MAX_EDGE:-1280}
      VLM_MAX_TOKENS: ${VLM_MAX_TOKENS:-1024}
      INFERENCE_API_KEY: ${VLLM_API_KEY:-}
