services:
  postgres:
    build:
      context: ./infra/postgres
    image: prom_app_postgres:local
    container_name: prom_app_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: prom_app
      POSTGRES_USER: prom_app
      POSTGRES_PASSWORD: prom_app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prom_app -d prom_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    build:
      context: ./infra/redis
    image: prom_app_redis:local
    container_name: prom_app_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3-storage:
    image: minio/minio:latest
    container_name: prom_app_s3_storage
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: prom_app
      MINIO_ROOT_PASSWORD: prom_app_password
    volumes:
      - s3_storage_data:/data

  s3_init:
    image: minio/mc:latest
    container_name: prom_app_s3_init
    depends_on:
      - s3-storage
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3-storage:9000 prom_app prom_app_password; do
        sleep 1;
      done;
      mc mb --ignore-existing local/video-originals-prom;
      mc mb --ignore-existing local/video-derived-prod;
      mc mb --ignore-existing local/video-detections-prod;
      mc anonymous set public local/video-originals-prom;
      "

  upload_service:
    build:
      context: ./prom_app/services/upload_service
    image: prom_app_upload_service:local
    container_name: prom_app_upload_service
    depends_on:
      postgres:
        condition: service_healthy
      s3_init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      UPLOAD_SERVICE_ADDRESS: ":8081"
      DATABASE_URL: postgres://prom_app:prom_app_password@postgres:5432/prom_app?sslmode=disable
      MINIO_INTERNAL_ENDPOINT: http://s3-storage:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ORIGINALS_BUCKET: video-originals-prom

  api_gateway:
    build:
      context: ./prom_app/services/api_gateway
    image: prom_app_api_gateway:local
    container_name: prom_app_api_gateway
    depends_on:
      - upload_service
    ports:
      - "8080:8080"
    environment:
      API_GATEWAY_ADDRESS: ":8080"
      UPLOAD_SERVICE_URL: http://upload_service:8081

  frontend:
    build:
      context: ./prom_app/frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: prom_app_frontend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
  s3_storage_data:
