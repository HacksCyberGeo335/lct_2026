log_format json_combined escape=json
    '{'
    '"log_type":"http_access",'
    '"level":"info",'
    '"service":"frontend",'
    '"method":"$request_method",'
    '"endpoint":"$uri",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"duration_seconds":$request_time,'
    '"remote_addr":"$remote_addr",'
    '"user_agent":"$http_user_agent",'
    '"error":"$sent_http_x_error"'
    '}';

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    # Resolve the Compose service at request time; the demo can start without Gateway.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;
    set $gateway http://api_gateway:8080;

    location /api/ {
        proxy_pass $gateway$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /health {
        proxy_pass $gateway/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location = /api { return 404; }
    location /assets/ { try_files $uri =404; }
    location /media/ { try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
